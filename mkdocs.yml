site_name: Andmekirjelduse standard
docs_dir: docs
site_url: https://e-gov.github.io/Andmekirjelduse-Standard/

theme:
  name: material
  features:
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - footnotes
  - toc:
      permalink: true
      toc_depth: 6

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike

nav:
  - Avaleht: index.md
  - Legacy (vana versioon): legacy/index.md